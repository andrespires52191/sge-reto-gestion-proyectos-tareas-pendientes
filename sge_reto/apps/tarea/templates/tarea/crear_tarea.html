<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Tarea</title>
</head>
<body>
<h1>Crear Tarea</h1>
{% if mensaje_error %}
    <p style="color: red;">{{ mensaje_error }}</p>
{% endif %}
<form method="POST" action="{% url 'tarea:crear_tarea' %}">
    {% csrf_token %}
    <input type="text" name="titulo" placeholder="Nombre de la tarea" required>
    <button type="submit">Crear Tarea</button>
</form>
</body>
</html>
